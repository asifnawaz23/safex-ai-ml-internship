<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">PII Detection and Redaction Pipeline</title>
<desc id="desc">Isometric stack of four layers: synthetic data (seed 42, 870 records), Presidio Analyzer (17 built-in and 6 custom recognisers), Anonymizer, and evaluation against ground truth. Overall recall rose from 0.5023 to 0.9071. A mini card shows a CNIC leaked by the baseline and redacted by the improved pipeline.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset=".55" stop-color="#EEF6FF"/><stop offset="1" stop-color="#DDF4FB"/></linearGradient><radialGradient id="glow" cx="66%" cy="50%" r="50%"><stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><linearGradient id="t2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#0E7490"/></linearGradient><pattern id="dots" width="28" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#1E40AF" fill-opacity=".10"/><circle cx="16" cy="10" r="1.2" fill="#1E40AF" fill-opacity=".10"/></pattern><clipPath id="card"><rect width="1280" height="560" rx="28"/></clipPath><filter id="depth" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#020617" flood-opacity=".28"/></filter><filter id="blur" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="10"/></filter><filter id="pk" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="cardsh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".28"/></filter><linearGradient id="top0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#14B8A6"/></linearGradient><linearGradient id="top1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93C5FD"/><stop offset="1" stop-color="#3B82F6"/></linearGradient><linearGradient id="top2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C4B5FD"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><linearGradient id="top3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></linearGradient></defs>
<style>.s{font-family:Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}.cm{font-family:'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace;font-size:17px;white-space:pre}.ch{font-family:'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace;font-size:13px;letter-spacing:1px;white-space:pre}.packet{opacity:0;animation:drop 4s ease-in-out infinite}@keyframes drop{0%{transform:translate(820px,104px);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(820px,428px);opacity:0}}.pulse{opacity:0;animation:pulse 4s ease-in-out infinite}.p2{animation-delay:1s}.p3{animation-delay:2s}.p4{animation-delay:3s}@keyframes pulse{0%,100%{opacity:0}12%{opacity:.28}30%{opacity:0}}@media (prefers-reduced-motion: reduce){.packet,.pulse{animation:none}.packet{opacity:0}}</style>
<g clip-path="url(#card)">
<rect width="1280" height="560" fill="url(#bg)"/>
<rect width="1280" height="560" fill="url(#glow)"/>
<rect x="640" y="0" width="640" height="560" fill="url(#dots)"/>
<ellipse cx="820" cy="528" rx="200" ry="24" fill="#0F172A" opacity=".22" filter="url(#blur)"/>
<line x1="820" y1="104" x2="820" y2="428" stroke="#0891B2" stroke-opacity=".45" stroke-width="2" stroke-dasharray="4 6"/>
<g filter="url(#depth)"><path d="M670,428 L820,503 L820,525 L670,450 Z" fill="#B45309"/><path d="M820,503 L970,428 L970,450 L820,525 Z" fill="#78350F"/><path d="M820,353 L970,428 L820,503 L670,428 Z" fill="url(#top3)"/></g><path d="M820,353 L970,428 L820,503 L670,428 Z" fill="none" stroke="#FFFFFF" stroke-opacity=".35"/><path d="M820,353 L970,428 L820,503 L670,428 Z" fill="#FFFFFF" class="pulse p4"/><g opacity=".92"><path d="M781,458 L790,462.5 L790,476.5 L781,472 Z" fill="#FEF3C7"/><path d="M790,462.5 L799,458 L799,472 L790,476.5 Z" fill="#FCD34D"/><path d="M790,453.5 L799,458 L790,462.5 L781,458 Z" fill="#FFFFFF"/><path d="M811,448 L820,452.5 L820,476.5 L811,472 Z" fill="#FEF3C7"/><path d="M820,452.5 L829,448 L829,472 L820,476.5 Z" fill="#FCD34D"/><path d="M820,443.5 L829,448 L820,452.5 L811,448 Z" fill="#FFFFFF"/><path d="M841,438 L850,442.5 L850,476.5 L841,472 Z" fill="#FEF3C7"/><path d="M850,442.5 L859,438 L859,472 L850,476.5 Z" fill="#FCD34D"/><path d="M850,433.5 L859,438 L850,442.5 L841,438 Z" fill="#FFFFFF"/></g>
<g filter="url(#depth)"><path d="M670,320 L820,395 L820,417 L670,342 Z" fill="#6D28D9"/><path d="M820,395 L970,320 L970,342 L820,417 Z" fill="#4C1D95"/><path d="M820,245 L970,320 L820,395 L670,320 Z" fill="url(#top2)"/></g><path d="M820,245 L970,320 L820,395 L670,320 Z" fill="none" stroke="#FFFFFF" stroke-opacity=".35"/><path d="M820,245 L970,320 L820,395 L670,320 Z" fill="#FFFFFF" class="pulse p3"/><g transform="matrix(0.894 0.447 -0.894 0.447 820 342)"><g fill="#1E1B4B" opacity=".85"><rect x="-26" y="-17" width="52" height="8" rx="4"/><rect x="-26" y="-4" width="40" height="8" rx="4"/><rect x="-26" y="9" width="52" height="8" rx="4"/></g></g>
<g filter="url(#depth)"><path d="M670,212 L820,287 L820,309 L670,234 Z" fill="#1D4ED8"/><path d="M820,287 L970,212 L970,234 L820,309 Z" fill="#1E3A8A"/><path d="M820,137 L970,212 L820,287 L670,212 Z" fill="url(#top1)"/></g><path d="M820,137 L970,212 L820,287 L670,212 Z" fill="none" stroke="#FFFFFF" stroke-opacity=".35"/><path d="M820,137 L970,212 L820,287 L670,212 Z" fill="#FFFFFF" class="pulse p2"/><g transform="matrix(0.894 0.447 -0.894 0.447 820 234)"><g fill="none" stroke="#FFFFFF" stroke-linecap="round" opacity=".85"><circle cx="-6" cy="-6" r="16" stroke-width="4"/><path d="M6 6 L20 20" stroke-width="6"/></g></g>
<g filter="url(#depth)"><path d="M670,104 L820,179 L820,201 L670,126 Z" fill="#0F766E"/><path d="M820,179 L970,104 L970,126 L820,201 Z" fill="#115E59"/><path d="M820,29 L970,104 L820,179 L670,104 Z" fill="url(#top0)"/></g><path d="M820,29 L970,104 L820,179 L670,104 Z" fill="none" stroke="#FFFFFF" stroke-opacity=".35"/><path d="M820,29 L970,104 L820,179 L670,104 Z" fill="#FFFFFF" class="pulse p1"/><g transform="matrix(0.894 0.447 -0.894 0.447 820 104)"><g fill="#FFFFFF" opacity=".85"><rect x="-30" y="-15" width="60" height="6" rx="3"/><rect x="-30" y="-3" width="44" height="6" rx="3"/><rect x="-30" y="9" width="52" height="6" rx="3"/></g></g>
<line x1="976" y1="104" x2="994" y2="104" stroke="#0891B2" stroke-opacity=".7" stroke-width="2"/>
<circle cx="976" cy="104" r="3" fill="#0891B2"/>
<text x="1002" y="106" class="s" font-size="18" font-weight="800" fill="#0F172A" letter-spacing=".5">01 SYNTHETIC DATA</text>
<text x="1002" y="128" class="s" font-size="15" fill="#4338CA">seed 42 · 870 records</text>
<line x1="976" y1="212" x2="994" y2="212" stroke="#0891B2" stroke-opacity=".7" stroke-width="2"/>
<circle cx="976" cy="212" r="3" fill="#0891B2"/>
<text x="1002" y="214" class="s" font-size="18" font-weight="800" fill="#0F172A" letter-spacing=".5">02 PRESIDIO ANALYZER</text>
<text x="1002" y="236" class="s" font-size="15" fill="#4338CA">17 built-in + 6 custom</text>
<line x1="976" y1="320" x2="994" y2="320" stroke="#0891B2" stroke-opacity=".7" stroke-width="2"/>
<circle cx="976" cy="320" r="3" fill="#0891B2"/>
<text x="1002" y="322" class="s" font-size="18" font-weight="800" fill="#0F172A" letter-spacing=".5">03 ANONYMIZER</text>
<text x="1002" y="344" class="s" font-size="15" fill="#4338CA">replace operators</text>
<line x1="976" y1="428" x2="994" y2="428" stroke="#0891B2" stroke-opacity=".7" stroke-width="2"/>
<circle cx="976" cy="428" r="3" fill="#0891B2"/>
<text x="1002" y="430" class="s" font-size="18" font-weight="800" fill="#0F172A" letter-spacing=".5">04 EVALUATION</text>
<text x="1002" y="452" class="s" font-size="15" fill="#4338CA">exact-span vs ground truth</text>
<path d="M0,-7 L7,0 L0,7 L-7,0 Z" fill="#0E7490" class="packet" filter="url(#pk)"/>
<text x="72" y="92" class="s" font-size="15" font-weight="700" letter-spacing="3" fill="#0E7490">SAFEX AI/ML INTERNSHIP · WEEK 4</text>
<text x="72" y="160" class="s" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#0F172A">PII Detection &amp;</text>
<text x="72" y="222" class="s" font-size="54" font-weight="800" letter-spacing="-1.5" fill="url(#t2)">Redaction Pipeline</text>
<text x="72" y="266" class="s" font-size="20" font-weight="500" fill="#3730A3">Microsoft Presidio · measured recall · privacy policy</text>
<text x="72" y="298" class="s" font-size="17" fill="#475569">Fictional water company · synthetic data · runs locally</text>
<rect x="72" y="320" width="233" height="42" rx="21" fill="#0E7490" fill-opacity="1" stroke="#0E7490" stroke-width="1.5"/>
<text x="188.5" y="346" class="s" font-size="15" font-weight="700" letter-spacing=".5" fill="#FFFFFF" text-anchor="middle">870 SYNTHETIC RECORDS</text>
<rect x="317" y="320" width="243" height="42" rx="21" fill="#FFFFFF" fill-opacity=".85" stroke="#0E7490" stroke-width="1.5"/>
<text x="438.5" y="346" class="s" font-size="15" font-weight="700" letter-spacing=".5" fill="#0F172A" text-anchor="middle">RECALL 0.5023 → 0.9071</text>
<g filter="url(#cardsh)"><rect x="72" y="392" width="560" height="120" rx="16" fill="#FFFFFF" fill-opacity=".95" stroke="#CBD5E1"/></g>
<text x="94" y="420" class="ch" fill="#475569" font-weight="700" textLength="405.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">REC-00008 · CNIC FIELD · VALUE MASKED IN THIS BANNER</text>
<text x="94" y="456" class="cm" fill="#0F172A" textLength="306" lengthAdjust="spacingAndGlyphs" xml:space="preserve">baseline  cnic=38***********-7</text>
<rect x="424.2" y="439" width="68.8" height="24" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
<text x="435.2" y="456" class="ch" fill="#991B1B" font-weight="700" textLength="46.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">LEAKED</text>
<text x="94" y="492" class="cm" fill="#0F172A" textLength="214.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">improved  cnic=[CNIC]</text>
<rect x="424.2" y="475" width="84.4" height="24" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
<text x="435.2" y="492" class="ch" fill="#166534" font-weight="700" textLength="62.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">REDACTED</text>
</g>
</svg>
